<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<!-- Alles draait lokaal; alleen praten met onze eigen Supabase is toegestaan.
     Beschermt tegen het injecteren of naladen van vreemde scripts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://sfkcnfwgjwqrmtmcksxd.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'">
<title>PA Annabel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=336dc22">
</head>
<body>

<div id="pull" aria-hidden="true"><span class="spinner"></span></div>

<header id="top">
  <h1>Annabel <span id="badge" class="badge" hidden></span></h1>
  <button id="refresh" class="icon-btn" aria-label="Verversen" hidden>&#8635;</button>
</header>

<main>
  <!-- Inloggen -->
  <section id="login" hidden>
    <div id="login-step-email">
      <p class="muted">Vul je e-mailadres in; je krijgt een cijfercode.</p>
      <form id="login-form">
        <input id="email" type="email" inputmode="email" autocomplete="email"
               placeholder="jouw@email.nl" required>
        <button type="submit" class="primary">Stuur code</button>
      </form>
      <button id="have-code" class="link-btn">Ik heb al een code</button>
    </div>
    <div id="login-step-code" hidden>
      <p class="muted">Typ de code uit de mail. Dit hoeft maar één keer — daarna blijf je ingelogd.</p>
      <form id="code-form">
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="12345678" required>
        <button type="submit" class="primary">Log in</button>
      </form>
      <button id="code-back" class="link-btn">Ander adres of nieuwe code</button>
    </div>
    <p id="login-msg" class="muted" role="status"></p>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <form id="cmd-form" autocomplete="off">
      <input id="cmd" type="text" placeholder="Vraag of opdracht voor Annabel…" maxlength="500">
      <button type="button" id="mic" aria-label="Inspreken" hidden>&#127908;</button>
      <button type="submit" class="primary" aria-label="Versturen">&#8593;</button>
    </form>
    <div id="approved-queue"></div>
    <div id="cmd-open"></div>

    <article id="brief" class="brief" hidden>
      <h2 id="brief-headline"></h2>
      <p id="brief-body"></p>
      <time id="brief-time" class="muted"></time>
    </article>

    <div id="list"></div>

    <div id="empty" class="empty" hidden>
      <p class="empty-mark">✓</p>
      <p>Niets open.</p>
      <p class="muted">Annabel kijkt morgenochtend weer.</p>
    </div>

    <details id="history" hidden>
      <summary><span id="history-count"></span></summary>
      <div id="history-list"></div>
    </details>

    <footer>
      <span id="who" class="muted"></span>
      <button id="logout" class="link-btn">Uitloggen</button>
    </footer>
  </section>

  <!-- Skeleton tijdens laden -->
  <div id="loading">
    <div class="skeleton sk-brief"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
  </div>

  <p id="error" class="error" role="alert" hidden></p>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-msg"></span>
  <button id="toast-undo" class="link-btn">Ongedaan maken</button>
</div>

<script src="config.js?v=336dc22"></script>
<script src="vendor/supabase.js?v=336dc22"></script>
<script type="module" src="app.js?v=336dc22"></script>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>PA Annabel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="pull" aria-hidden="true"><span class="spinner"></span></div>

<header id="top">
  <h1>Annabel <span id="badge" class="badge" hidden></span></h1>
  <button id="refresh" class="icon-btn" aria-label="Verversen" hidden>&#8635;</button>
</header>

<main>
  <!-- Inloggen -->
  <section id="login" hidden>
    <p class="muted">Log in met een magic link. Er komt een mailtje; die link opent deze app.</p>
    <form id="login-form">
      <input id="email" type="email" inputmode="email" autocomplete="email"
             placeholder="jouw@email.nl" required>
      <button type="submit" class="primary">Stuur link</button>
    </form>
    <p id="login-msg" class="muted" role="status"></p>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <article id="brief" class="brief" hidden>
      <h2 id="brief-headline"></h2>
      <p id="brief-body"></p>
      <time id="brief-time" class="muted"></time>
    </article>

    <div id="list"></div>

    <div id="empty" class="empty" hidden>
      <p class="empty-mark">✓</p>
      <p>Niets open.</p>
      <p class="muted">Annabel kijkt morgenochtend weer.</p>
    </div>

    <details id="history" hidden>
      <summary><span id="history-count"></span></summary>
      <div id="history-list"></div>
    </details>

    <footer>
      <span id="who" class="muted"></span>
      <button id="logout" class="link-btn">Uitloggen</button>
    </footer>
  </section>

  <!-- Skeleton tijdens laden -->
  <div id="loading">
    <div class="skeleton sk-brief"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
  </div>

  <p id="error" class="error" role="alert" hidden></p>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-msg"></span>
  <button id="toast-undo" class="link-btn">Ongedaan maken</button>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

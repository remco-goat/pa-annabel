name: annabel

# Annabels brein in de cloud — de laptop hoeft niet aan te staan.
#   - Volledige run (mail+agenda+todo -> brief+voorstellen): 3x per dag
#   - Tick (goedgekeurd uitvoeren + opdrachten uit de app): elk half uur
# GitHub Actions-cron loopt in UTC en kan enkele minuten later vuren.
on:
  schedule:
    - cron: "0 5-17 * * *"  # elk uur, 07:00-19:00 NL (zomertijd; winter: 08:00-20:00)
    - cron: "*/15 * * * *"  # tick — opdrachten en goedkeuringen snel oppakken
  workflow_dispatch:
    inputs:
      job:
        description: "wat draaien: run (volledige brief) of tick"
        default: "tick"
        type: choice
        options: [run, tick]
      force:
        description: "brief ook buiten het NL-uurvenster (07-19) draaien"
        default: false
        type: boolean

concurrency:
  group: annabel
  cancel-in-progress: false

jobs:
  annabel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Geheimen klaarzetten
        env:
          ENV_FILE: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            TODOIST_TOKEN=${{ secrets.TODOIST_TOKEN }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            PICNIC_AUTH_TOKEN=${{ secrets.PICNIC_AUTH_TOKEN }}
            TODO_PROVIDER=todoist
            ASSISTANT_MODEL=claude-opus-5
            ASSISTANT_EFFORT=medium
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT_JSON }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          mkdir -p .secrets
          printf '%s' "$GOOGLE_CLIENT" > .secrets/google_client.json
          printf '%s' "$GOOGLE_TOKEN"  > .secrets/google_token.json

      - name: Volledige run (brief + voorstellen)
        if: github.event.schedule == '0 5-17 * * *' || inputs.job == 'run'
        env:
          # Guard in agent/run.py slaat geplande runs buiten 07-19 NL over.
          # pg_cron triggert óók via workflow_dispatch, dus mens/scheduler is
          # hier niet te onderscheiden: altijd "1", tenzij een mens bewust
          # forceert met -f force=true.
          ANNABEL_SCHEDULED: ${{ inputs.force == true && '0' || '1' }}
        run: python -m agent.run

      - name: Tick (uitvoeren + opdrachten)
        if: github.event.schedule == '*/15 * * * *' || inputs.job == 'tick'
        run: python -m agent.apply && python -m agent.commands
